  let q = params.get("lang");
  try { q = q || localStorage.getItem("cz.lang"); } catch { /* 없음 */ }
  if (["en", "ko", "ja", "zh"].includes(q)) return q;
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const c = l.slice(0, 2).toLowerCase();
    if (["en", "ko", "ja", "zh"].includes(c)) return c;
  }
  return "en";
}
const PLACE_BY_LANG = { en: "", ko: "&place=seoul", ja: "&place=tokyo", zh: "&place=shanghai" };

function apply(lang) {
  I18N.lang = lang;
  document.documentElement.lang = lang;
  document.getElementById("lang").value = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = T[el.dataset.t].s;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.title = T.name.s + " — " + T.h1.s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  const q = `lang=${lang}${PLACE_BY_LANG[lang]}`;
  document.getElementById("try").href = `play.html?${q}`;
  const demo = document.getElementById("demo"), src = `play.html?embed=1&${q}`;
  if (demo.getAttribute("src") !== src) demo.setAttribute("src", src);
  document.getElementById("still").src = `img/shot_${lang}_2.png`;
  document.getElementById("video").src = `https://www.youtube-nocookie.com/embed/${VIDEO[lang]}?rel=0`;
  const play = document.getElementById("play");
  if (LAUNCHED) play.href = PLAY; else { play.removeAttribute("href"); play.setAttribute("aria-disabled", ""); }
  const ladder = document.getElementById("ladder");
  ladder.innerHTML = "";
  LEVELS.forEach(lv => {
    const a = document.createElement("a");
    a.href = `play.html?${q}&logW=${lv.logS.toFixed(2)}`;
    a.innerHTML = `<span class="e"></span><span class="n"></span><span class="p"></span>`;
    a.querySelector(".e").textContent = lv.emoji;
    a.querySelector(".n").textContent = lv.name;
    a.querySelector(".p").textContent = powerText(lv.logS);
    ladder.appendChild(a);
  });
}
SESSION.place = PLACES.seoul;
document.getElementById("lang").addEventListener("change", e => {
  try { localStorage.setItem("cz.lang", e.target.value); } catch { /* 없음 */ }
  SESSION.place = { en: PLACES.newYork, ko: PLACES.seoul, ja: PLACES.tokyo, zh: PLACES.shanghai }[e.target.value];
  apply(e.target.value);
});
{
  const lang = pickLang();
  SESSION.place = { en: PLACES.newYork, ko: PLACES.seoul, ja: PLACES.tokyo, zh: PLACES.shanghai }[lang];
  apply(lang);
}
</script>
